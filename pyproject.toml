[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "boa-graph-python"
dynamic = ["version"]
description = "Éditeur visuel de graphes Python"
requires-python = ">=3.12,<3.14"
dependencies = ["PySide6>=6.7,<7"]

[project.gui-scripts]
boa = "boa.app:run"

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.dynamic]
version = {attr = "boa.__version__"}

[tool.setuptools.packages.find]
include = ["boa*"]

[tool.setuptools.package-data]
boa = [
  "assets/*.png",
  "assets/*.ico",
  "i18n/*.json",
  "resources/*.json",
  "python_importer/indexes/*.json",
]
